  content:
    abstract: "LLM-agents are increasingly used to accelerate the progress of scientific\
      \ research. Yet a persistent bottleneck is data access: agents not only lack\
      \ readily available tools for retrieval, but also have to work with unstrcutured,\
      \ human-centric data on the Internet, such as HTML web-pages and PDF files,\
      \ leading to excessive token consumption, limit working efficiency, and brittle\
      \ evidence look-up. This gap motivates the development of \\textit{an agentic\
      \ data interface}, which is designed to enable agents to access and utilize\
      \ scientific literature in a more effective, efficient, and cost-aware manner.\n\
      \  In this paper, we introduce DeepXiv-SDK, which offers a three-layer agentic\
      \ data interface for scientific literature. 1) Data Layer, which transforms\
      \ unstructured, human-centric data into normalized and structured representations\
      \ in JSON format, improving data usability and enabling progressive accessibility\
      \ of the data. 2) Service Layer, which presents readily available tools for\
      \ data access and ad-hoc retrieval. It also enables a rich form of agent usage,\
      \ including CLI, MCP, and Python SDK. 3) Application Layer, which creates a\
      \ built-in agent, packaging basic tools from the service layer to support complex\
      \ data access demands.\n  DeepXiv-SDK currently supports the complete ArXiv\
      \ corpus, and is synchronized daily to incorporate new releases. It is designed\
      \ to extend to all common open-access corpora, such as PubMed Central, bioRxiv,\
      \ medRxiv, and chemRxiv. We release RESTful APIs, an open-source Python SDK,\
      \ and a web demo showcasing deep search and deep research workflows. DeepXiv-SDK\
      \ is free to use with registration."
