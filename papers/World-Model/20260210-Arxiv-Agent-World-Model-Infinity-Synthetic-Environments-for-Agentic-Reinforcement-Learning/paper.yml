  content:
    abstract: Recent advances in large language model (LLM) have empowered autonomous
      agents to perform complex tasks that require multi-turn interactions with tools
      and environments. However, scaling such agent training is limited by the lack
      of diverse and reliable environments. In this paper, we propose Agent World
      Model (AWM), a fully synthetic environment generation pipeline. Using this pipeline,
      we scale to 1,000 environments covering everyday scenarios, in which agents
      can interact with rich toolsets (35 tools per environment on average) and obtain
      high-quality observations. Notably, these environments are code-driven and backed
      by databases, providing more reliable and consistent state transitions than
      environments simulated by LLMs. Moreover, they enable more efficient agent interaction
      compared with collecting trajectories from realistic environments. To demonstrate
      the effectiveness of this resource, we perform large-scale reinforcement learning
      for multi-turn tool-use agents. Thanks to the fully executable environments
      and accessible database states, we can also design reliable reward functions.
      Experiments on three benchmarks show that training exclusively in synthetic
      environments, rather than benchmark-specific ones, yields strong out-of-distribution
      generalization. The code is available at https://github.com/Snowflake-Labs/agent-world-model.
