  content:
    abstract: Understanding the environment and a robot's physical reachability is
      crucial for task execution. While state-of-the-art vision-language models (VLMs)
      excel in environmental perception, they often generate inaccurate or impractical
      responses in embodied visual reasoning tasks due to a lack of understanding
      of robotic physical reachability. To address this issue, we propose a unified
      representation of physical reachability across diverse robots, i.e., Space-Physical
      Reachability Map (S-P Map), and PhysVLM, a vision-language model that integrates
      this reachability information into visual reasoning. Specifically, the S-P Map
      abstracts a robot's physical reachability into a generalized spatial representation,
      independent of specific robot configurations, allowing the model to focus on
      reachability features rather than robot-specific parameters. Subsequently, PhysVLM
      extends traditional VLM architectures by incorporating an additional feature
      encoder to process the S-P Map, enabling the model to reason about physical
      reachability without compromising its general vision-language capabilities.
      To train and evaluate PhysVLM, we constructed a large-scale multi-robot dataset,
      Phys100K, and a challenging benchmark, EQA-phys, which includes tasks for six
      different robots in both simulated and real-world environments. Experimental
      results demonstrate that PhysVLM outperforms existing models, achieving a 14\%
      improvement over GPT-4o on EQA-phys and surpassing advanced embodied VLMs such
      as RoboMamba and SpatialVLM on the RoboVQA-val and OpenEQA benchmarks. Additionally,
      the S-P Map shows strong compatibility with various VLMs, and its integration
      into GPT-4o-mini yields a 7.1\% performance improvement.
