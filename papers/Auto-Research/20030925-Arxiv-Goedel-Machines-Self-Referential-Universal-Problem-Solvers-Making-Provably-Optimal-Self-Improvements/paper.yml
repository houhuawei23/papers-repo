  title: 'Goedel Machines: Self-Referential Universal Problem Solvers Making Provably
    Optimal Self-Improvements'
  authors:
  - name: Juergen Schmidhuber
  publication:
    type: preprint
    venue: arXiv
    date_published: '2003-09-25'
